name: Provisoire Code Checker

on:
  workflow_dispatch:
    inputs:
      id_number:
        description: "ID to check (leave empty to use secret IREMBO_ID or the default)"
        required: false
        default: ""
  # Scheduled runs PAUSED for now: Irembo times out GitHub runners, and empty
  # runs must never overwrite good data. Re-enable (e.g. hourly) once green
  # runs are consistent again.
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: provisoire-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm i playwright@latest --no-save
          npx playwright install --with-deps chromium

      - name: Check Irembo provisoire slots
        env:
          IREMBO_ID: ${{ secrets.IREMBO_ID }}
          INPUT_ID: ${{ inputs.id_number }}
        run: |
          node --check check.mjs && echo "syntax OK"
          node check.mjs

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisoire-debug
          path: |
            step-*.png
            result.json
            options-*.json
            home-dump-*.html
          if-no-files-found: ignore

      - name: Save result + shots
        if: always()
        run: |
          # NEVER overwrite good data with an empty capture: if no district
          # produced rows, fail loudly and keep the previous commit.
          # NEVER overwrite good data with an empty capture: re-parse each
          # district's raw text with the worker-grade pattern (check.mjs's own
          # rows field uses a narrower pattern and is NOT the source of truth).
          # Zero parsed rows anywhere = fail loudly, keep the previous commit.
          DATA_ROWS=$(node -e "const j=require('./result.json');const re=/(\d{2}-\d{2}-\d{4})\s*\n([^\n]+)\n([^\n]*?\d{1,2}:\d{2}\s*(?:AM|PM)[^\n]*)\n(?:Imyanya|Umwanya)\s*\n(\d+)/gi;let n=0;for(const t of ['mudasobwa','impapuro']){const D=(j.types&&j.types[t]&&j.types[t].districts)||{};for(const k of Object.keys(D)){const txt=((D[k]||{}).text)||'';let m;re.lastIndex=0;while((m=re.exec(txt))){n++;if(n>=1)break;}if(n>=1)break;}if(n>=1)break;}console.log(n)")
          if [ "$DATA_ROWS" = "0" ]; then
            echo "no slot rows captured — refusing to overwrite good data"
            exit 1
          fi
          mkdir -p shots
          mkdir -p shots
          # drop last run's shots so a failed run shows a placeholder, not a stale image
          rm -f shots/*.png
          for d in bugesera burera gakenke gasabo gatsibo gicumbi gisagara huye kamonyi karongi kayonza kicukiro kirehe muhanga musanze ngoma ngororero nyabihu nyagatare nyamagabe nyamasheke nyanza nyarugenge nyaruguru rubavu ruhango rulindo rusizi rutsiro rwamagana; do
            # mudasobwa (default) shot
            f="step-10-mudasobwa-district-${d}.png"
            [ -f "$f" ] && cp "$f" "shots/${d}.png"
            # impapuro shot (suffixed; worker serves it with ?t=impapuro)
            f2="step-10-impapuro-district-${d}.png"
            [ -f "$f2" ] && cp "$f2" "shots/${d}-impapuro.png"
          done
          # NOTE: step-10-*-applicant.png is deliberately NOT committed — it can
          # contain the applicant ID number. Debug artifacts stay in Actions only.
          if [ -f result.json ]; then
            git config user.name "provisoire-bot"
            git config user.email "provisoire-bot@users.noreply.github.com"
            # Commit FIRST (always succeeds), then rebase onto any parallel
            # push (manual commits, retries) and push. The old order (pull
            # before commit) died on "unstaged changes" and lost the data.
            git add -A result.json shots || true
            if git diff --staged --quiet; then
              echo "no changes to save"
            else
              git commit -m "check $(date -u +%FT%TZ)"
              git pull --rebase origin main || true
              git push origin HEAD:main
            fi
          fi
