name: Provisoire Code Checker

on:
  workflow_dispatch:
    inputs:
      id_number:
        description: "ID to check (leave empty to use secret IREMBO_ID or the default)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: provisoire-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm i playwright@latest --no-save
          npx playwright install --with-deps chromium

      - name: Check Irembo provisoire slots
        env:
          IREMBO_ID: ${{ secrets.IREMBO_ID }}
          INPUT_ID: ${{ inputs.id_number }}
        run: |
          node --check check.mjs && echo "syntax OK"
          node check.mjs

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisoire-debug
          path: |
            step-*.png
            result.json
            options.json
            home-dump.html
          if-no-files-found: ignore

      - name: Save result + shots
        if: always()
        run: |
          mkdir -p shots
          for d in nyamasheke nyarugenge kicukiro; do
            f="step-10-district-${d}.png"
            [ -f "$f" ] && cp "$f" "shots/${d}.png"
          done
          [ -f step-10-applicant.png ] && cp step-10-applicant.png shots/latest.png || true
          if [ -f result.json ]; then
            git config user.name "provisoire-bot"
            git config user.email "provisoire-bot@users.noreply.github.com"
            git add -A result.json shots || true
            git diff --staged --quiet || (git commit -m "check $(date -u +%FT%TZ)" && git push)
          fi
