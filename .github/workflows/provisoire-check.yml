name: Provisoire Code Checker

on:
  workflow_dispatch:
    inputs:
      id_number:
        description: "ID to check (leave empty to use secret IREMBO_ID or the default)"
        required: false
        default: ""
      district:
        description: "Single district to test (leave empty for full verified sweep)"
        required: false
        default: ""
  # Daytime auto-runs (Kigali = UTC+2): 09:00 + 15:00 Kigali. 2x30min/day
  # fits the 2000 free Actions min/month. Night runs capture zeros and waste
  # minutes, so there is no night cron and the night-gate step skips full
  # sweeps outside 05:00-20:00 Kigali. Empty captures never overwrite good
  # data (rows gate in the save step).
  schedule:
    - cron: "0 7,13 * * *"

permissions:
  contents: write

concurrency:
  group: provisoire-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INPUT_DISTRICT: ${{ inputs.district }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Night gate (full sweep only)
        id: gate
        run: |
          if [ -n "${INPUT_DISTRICT:-}" ]; then
            echo "go=true" >> $GITHUB_OUTPUT
            echo "single-district test — always runs"
            exit 0
          fi
          H=$(TZ=Africa/Kigali date +%-H)
          if [ "$H" -lt 5 ] || [ "$H" -ge 20 ]; then
            echo "go=false" >> $GITHUB_OUTPUT
            echo "Kigali ${H}h at night — Irembo shows no slots. Skipping (not a failure)."
          else
            echo "go=true" >> $GITHUB_OUTPUT
            echo "Kigali ${H}h daytime — proceeding."
          fi

      - name: Install Playwright
        if: steps.gate.outputs.go == 'true'
        run: |
          npm i playwright@latest --no-save
          npx playwright install --with-deps chromium

      - name: Check Irembo provisoire slots
        if: steps.gate.outputs.go == 'true'
        env:
          IREMBO_ID: ${{ secrets.IREMBO_ID }}
          INPUT_ID: ${{ inputs.id_number }}
        run: |
          node --check check.mjs && echo "syntax OK"
          node check.mjs

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisoire-debug
          path: |
            step-*.png
            result.json
            options-*.json
            home-dump-*.html
          if-no-files-found: ignore

      - name: Save result + shots
        if: steps.gate.outputs.go == 'true'
        run: |
          # Single-district test runs never touch committed data: results stay
          # in the debug artifacts for inspection only.
          if [ -n "${INPUT_DISTRICT:-}" ]; then
            echo "single-district test ($INPUT_DISTRICT) - artifacts only, no commit"
            exit 0
          fi
          # NEVER overwrite good data with an empty capture: if no district
          # produced rows, fail loudly and keep the previous commit.
          # NEVER overwrite good data with an empty capture: re-parse each
          # district's raw text with the worker-grade pattern (check.mjs's own
          # rows field uses a narrower pattern and is NOT the source of truth).
          # Zero parsed rows anywhere = fail loudly, keep the previous commit.
          DATA_ROWS=$(node -e "const j=require('./result.json');const re=/(\d{2}-\d{2}-\d{4})\s*\n([^\n]+)\n([^\n]*?\d{1,2}:\d{2}\s*(?:AM|PM)[^\n]*)\n(?:Imyanya|Umwanya)\s*\n(\d+)/gi;let n=0;for(const t of ['mudasobwa','impapuro']){const D=(j.types&&j.types[t]&&j.types[t].districts)||{};for(const k of Object.keys(D)){const txt=((D[k]||{}).text)||'';let m;re.lastIndex=0;while((m=re.exec(txt))){n++;if(n>=1)break;}if(n>=1)break;}if(n>=1)break;}console.log(n)" 2>/dev/null || echo BAD)
          if ! [ "$DATA_ROWS" -ge 1 ] 2>/dev/null; then
            echo "no slot rows captured (got '$DATA_ROWS') — refusing to overwrite good data"
            exit 1
          fi
          mkdir -p shots
          mkdir -p shots
          # drop last run's shots so a failed run shows a placeholder, not a stale image
          rm -f shots/*.png
          for d in bugesera gicumbi gisagara huye karongi kayonza kicukiro kirehe muhanga musanze ngoma ngororero nyagatare nyamagabe nyamasheke nyanza nyarugenge rubavu ruhango rusizi rutsiro rwamagana; do
            # mudasobwa (default) shot
            f="step-10-mudasobwa-district-${d}.png"
            [ -f "$f" ] && cp "$f" "shots/${d}.png"
            # impapuro shot (suffixed; worker serves it with ?t=impapuro)
            f2="step-10-impapuro-district-${d}.png"
            [ -f "$f2" ] && cp "$f2" "shots/${d}-impapuro.png"
          done
          # NOTE: step-10-*-applicant.png is deliberately NOT committed — it can
          # contain the applicant ID number. Debug artifacts stay in Actions only.
          if [ -f result.json ]; then
            git config user.name "provisoire-bot"
            git config user.email "provisoire-bot@users.noreply.github.com"
            # Fresh capture always wins conflicts (merge -X ours): a queued
            # run holds newer data than whatever landed while it was working.
            git add -A result.json shots || true
            if git diff --staged --quiet; then
              echo "no changes to save"
            else
              git commit -m "check $(date -u +%FT%TZ)"
              git fetch origin main || true
              git merge -X ours origin/main -m "merge latest capture" 2>/dev/null || true
              for i in 1 2 3; do git push origin HEAD:main && break || sleep 10; done
              git status -sb | head -3 && git log origin/main -1 --format=%H | grep -q "$(git rev-parse HEAD)" && echo "pushed OK" || exit 1
            fi
          fi

      - name: Run summary
        if: always()
        run: |
          node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync("./result.json","utf8"));let s="## Provisoire check "+(j.finished_at||"unknown")+"\n";for(const t of ["mudasobwa","impapuro"]){const D=(j.types&&j.types[t]&&j.types[t].districts)||{};const ks=Object.keys(D);const has=ks.filter(k=>(D[k].rows||[]).length>0);const err=ks.filter(k=>D[k].error);s+="\n**"+t+"**: "+has.length+" with slots, "+err.length+" errors / "+ks.length+" checked"+(err.length?" ("+err.join(", ")+")":"")+"\n";}fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);}catch(e){}' || true

      - name: Verify live worker serves fresh data
        if: ${{ inputs.district == '' && steps.gate.outputs.go == 'true' }}
        run: |
          TODAY=$(date -u +%F)
          for i in $(seq 1 10); do
            GOT=$(curl -s --max-time 20 "https://provisoire-slots.ndatimanah.workers.dev/api/health" || true)
            echo "try $i: $GOT"
            echo "$GOT" | grep -q "$TODAY" && { echo "worker is fresh"; exit 0; }
            sleep 30
          done
          echo "WARNING: worker not fresh yet — check /api/health later"
          exit 0
