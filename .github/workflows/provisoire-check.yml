name: Provisoire Code Checker
on:
  workflow_dispatch:
    inputs:
      id_number:
        description: "ID to check (leave empty to use secret IREMBO_ID)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
concurrency:
  group: provisoire-checker
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@latest
          npx playwright install --with-deps chromium
      - name: Check Irembo provisoire
        env:
          IREMBO_ID: ${{ secrets.IREMBO_ID }}
          INPUT_ID: ${{ inputs.id_number }}
        run: |
          cat > check.mjs << 'CHECK_EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const ID = "1200480003683096"; // hardcoded per owner request
          if (!ID) { console.error('Missing ID: set secret IREMBO_ID or dispatch input id_number'); process.exit(1); }
          console.log(`Checking ID ending ...${ID.slice(-4)}`);
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const ctx = await browser.newContext({ locale: 'rw-RW', viewport: { width: 1280, height: 900 }, timezoneId: 'Africa/Kigali', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' });
          const page = await ctx.newPage();
          const out = { started_at: new Date().toISOString(), steps: [] };
          try {
            await page.goto('https://irembo.gov.rw/', { waitUntil: 'networkidle', timeout: 90000 });
            await sleep(4000);
            await page.screenshot({ path: 'step-01-home.png' });
            out.steps.push('home');
            // 1. Find "Kwiyandikisha gukora ikizamini" link/button
            const examLink = page.getByText(/kwiyandikisha.*kizamini/i).first();
            if (await examLink.count()) { await examLink.click({ timeout: 15000 }); await sleep(5000); }
            else {
              // fallback: direct search in page text dump for debugging
              const t = (await page.content()).slice(0, 5000);
              fs.writeFileSync('home-dump.html', t);
              throw new Error('exam link not found - see step-01-home.png');
            }
            await page.screenshot({ path: 'step-02-exam.png' });
            out.steps.push('exam');
            // 2. Polisi category: open ng-select combobox, then pick Polisi option
            const combo = page.locator('div[role="combobox"], .ng-input, .ng-select').first();
            if (await combo.count()) { await combo.click({ timeout: 15000 }); await sleep(3000); }
            await page.screenshot({ path: 'step-03-combo-open.png' });
            const opts = page.locator('[role="option"], .ng-option, .ng-dropdown-panel .ng-option');
            const nopt = await opts.count().catch(() => 0);
            console.log(`combo options=${nopt}`);
            try {
              const dump = await opts.allInnerTexts();
              fs.writeFileSync('options.json', JSON.stringify(dump.slice(0, 50), null, 2));
              console.log(dump.slice(0, 20).join(' | ').slice(0, 1500));
            } catch {}
            let picked = false;
            for (let i = 0; i < Math.min(nopt, 30); i++) {
              let t = '';
              try { t = await opts.nth(i).innerText({ timeout: 3000 }); } catch { continue; }
              if (/polisi/i.test(t)) { await opts.nth(i).click({ timeout: 8000 }); picked = true; await sleep(5000); break; }
            }
            if (!picked) {
              // fallback: click any option containing ikizamini to proceed, log it
              for (let i = 0; i < Math.min(nopt, 30); i++) {
                let t = '';
                try { t = await opts.nth(i).innerText({ timeout: 3000 }); } catch { continue; }
                if (/ikizamini/i.test(t)) { console.log('fallback pick: ' + t.slice(0, 120)); await opts.nth(i).click({ timeout: 8000 }); picked = true; await sleep(5000); break; }
              }
            }
            await page.screenshot({ path: 'step-03-polisi.png' });
            out.steps.push('polisi');
            // 4. Click Saba to open service page, then enter ID there
            const saba = page.getByRole('button', { name: /saba/i }).first();
            if (await saba.count()) { await saba.click({ timeout: 15000 }); await sleep(8000); }
            await page.screenshot({ path: 'step-04-popup.png' });
            out.steps.push('popup');
            out.after_saba_url = page.url();
            out.after_saba_text = (await page.evaluate(() => document.body.innerText || '')).slice(0, 2000);
            console.log('after Saba: ' + out.after_saba_url);
            console.log(out.after_saba_text.slice(0, 1000));
            // 5. ID input on service page
            let typed = false;
            for (const sel of ['input[name*="id" i]', 'input[placeholder*="ID" i]', 'input[type="text"]']) {
              const inputs = page.locator(sel);
              const n = await inputs.count().catch(() => 0);
              for (let i = 0; i < Math.min(n, 10); i++) {
                try {
                  const inp = inputs.nth(i);
                  if (await inp.isVisible()) { await inp.fill(ID, { timeout: 8000 }); typed = true; break; }
                } catch {}
              }
              if (typed) break;
            }
            if (!typed) throw new Error('ID input not found - see step-04-popup.png');
            await sleep(1500);
            await page.screenshot({ path: 'step-05-id-filled.png' });
            out.steps.push('id-filled');
            // 5. Proceed / Komeza button
            for (const pat of [/ibikurikira/i, /komeza/i, /proceed/i, /continue/i, /next/i, /ohereza/i]) {
              const b = page.getByRole('button', { name: pat }).first();
              try { if (await b.count() && await b.isVisible() && await b.isEnabled()) { await b.click({ timeout: 8000 }); typed = true; await sleep(6000); break; } } catch {}
            }
            await page.screenshot({ path: 'step-06-result.png' });
            out.steps.push('result');
            // 6. Gusuzuma popup: name + terms + Genzura, plus DOB if asked
            const NAME = "Herve";
            const DOB = "28/12/2004"; // dd/mm/yyyy
            try {
              const nameInput = page.getByPlaceholder(/rimwe.*mazina|injiza.*mazina/i).first();
              if (await nameInput.count()) { await nameInput.fill(NAME, { timeout: 8000 }); await sleep(1000); out.steps.push('name-filled'); }
              else {
                const allInputs = page.locator('input[type="text"]');
                const nn = await allInputs.count().catch(() => 0);
                for (let i = 0; i < Math.min(nn, 10); i++) {
                  try {
                    const inp = allInputs.nth(i);
                    if (await inp.isVisible()) { const v = await inp.inputValue().catch(() => ''); if (!v) { await inp.fill(NAME, { timeout: 5000 }); out.steps.push('name-filled'); break; } }
                  } catch {}
                }
              }
              // DOB if present: text or date input
              const dobSel = page.locator('input[type="date"], input[placeholder*="birth" i], input[placeholder*="amavuko" i], input[placeholder*="itariki" i]');
              if (await dobSel.count()) {
                const d = dobSel.first();
                try {
                  if (await d.isVisible()) {
                    const typ = await d.getAttribute('type');
                    if (typ === 'date') { const [dd, mm, yyyy] = DOB.split('/'); await d.fill(`${yyyy}-${mm}-${dd}`, { timeout: 8000 }); }
                    else await d.fill(DOB, { timeout: 8000 });
                    out.steps.push('dob-filled');
                  }
                } catch {}
              }
              await page.screenshot({ path: 'step-07-verify-filled.png' });
              // terms checkbox - custom control, click label text
              try {
                const lbl = page.getByText(/nemeye/i).first();
                if (await lbl.count()) { await lbl.click({ timeout: 5000 }); await sleep(1000); }
              } catch {}
              try {
                const chk2 = page.locator('input[type="checkbox"]').first();
                if (await chk2.count()) { try { await chk2.check({ force: true, timeout: 5000 }); } catch { try { await chk2.click({ force: true, timeout: 5000 }); } catch {} } }
              } catch {}
              const genzura = page.getByRole('button', { name: /genzura/i }).first();
              if (await genzura.count()) { await genzura.click({ timeout: 8000 }); await sleep(8000); out.steps.push('genzura-clicked'); }
              await page.screenshot({ path: 'step-08-after-genzura.png' });
            } catch (e2) { out.verify_error = String(e2.message).slice(0, 300); }
            out.steps.push('verified');
            // 7. After verification: scroll, dump form, handle DOB/name wherever they appear
            try {
              await page.evaluate(() => window.scrollBy(0, 800));
              await sleep(1500);
              await page.screenshot({ path: 'step-09-after-next.png', fullPage: true });
              const dump = await page.evaluate(() => {
                const ins = [...document.querySelectorAll('input, select, button')].map(el => ({
                  tag: el.tagName, type: el.type || '', name: el.name || '', ph: el.placeholder || '',
                  label: (el.labels && el.labels[0] ? el.labels[0].innerText : '').slice(0, 80),
                  txt: (el.innerText || '').slice(0, 80), dis: el.disabled || false, vis: el.offsetParent !== null
                }));
                return { url: location.href, body: document.body.innerText.slice(0, 3000), inputs: ins.slice(0, 60) };
              });
              fs.writeFileSync('form-dump.json', JSON.stringify(dump, null, 2));
              console.log('FORM: ' + JSON.stringify(dump.inputs).slice(0, 2000));
              out.applicant_text = dump.body.slice(0, 2000);
              // DOB fill if present
              const dob3 = page.locator('input[type="date"]').first();
              try { if (await dob3.count() && await dob3.isVisible()) { await dob3.fill('2004-12-28', { timeout: 8000 }); out.steps.push('dob-filled'); } } catch {}
              for (const sel of ['input[placeholder*="itariki" i]', 'input[placeholder*="amavuko" i]', 'input[placeholder*="birth" i]']) {
                try { const dl = page.locator(sel).first(); if (await dl.count() && await dl.isVisible()) { await dl.fill(DOB, { timeout: 5000 }); out.steps.push('dob-filled'); break; } } catch {}
              }
              // empty name fields -> Herve
              const txts = page.locator('input[type="text"]');
              const tn = await txts.count().catch(() => 0);
              for (let i = 0; i < Math.min(tn, 15); i++) {
                try {
                  const inp = txts.nth(i);
                  if (!(await inp.isVisible())) continue;
                  const v = await inp.inputValue().catch(() => '');
                  const ph = (await inp.getAttribute('placeholder').catch(() => '') || '');
                  if (!v && /izina|amazina|name/i.test(ph)) { await inp.fill(NAME, { timeout: 5000 }); }
                } catch {}
              }
              const nextBtn2 = page.getByRole('button', { name: /ibikurikira/i }).first();
              try {
                const dis = await nextBtn2.isDisabled().catch(() => null);
                out.next_disabled = dis;
                console.log('Ibikurikira disabled=' + dis);
                if (dis === false) { await nextBtn2.click({ timeout: 8000 }); await sleep(8000); out.steps.push('next-clicked'); }
              } catch (eN) { out.applicant_error = String(eN.message).slice(0, 300); }
              await page.screenshot({ path: 'step-10-applicant.png', fullPage: true });
              out.steps.push('applicant-handled');
            } catch (e3) { out.applicant_error = String(e3.message).slice(0, 300); }
            out.body_text = (await page.evaluate(() => document.body.innerText || '')).slice(0, 4000);
            console.log(out.body_text.slice(0, 1500));
          } catch (e) {
            out.error = String(e.message).slice(0, 500);
            console.error('CHECK FAILED:', e.message);
            try { await page.screenshot({ path: 'step-ERR.png' }); } catch {}
          } finally {
            out.finished_at = new Date().toISOString();
            fs.writeFileSync('result.json', JSON.stringify(out, null, 2));
            await browser.close();
          }
          CHECK_EOF
          node --check check.mjs && echo "syntax OK"
          node check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisoire-debug
          path: |
            step-*.png
            result.json
            home-dump.html
          if-no-files-found: ignore
      - name: Save result
        if: always()
        run: |
          if [ -f result.json ]; then
            git config user.name "provisoire-bot"
            git config user.email "provisoire-bot@users.noreply.github.com"
            git add result.json || true
            git diff --staged --quiet || (git commit -m "check $(date -u +%FT%TZ)" && git push)
          fi

